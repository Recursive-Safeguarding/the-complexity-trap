# GLM-4.7 reproduction: llm_summary + hybrid with summarizer comparison
# Grid search on verified-mini (50 curated instances)
# 2 strategies × 4 summarizers = 8 runs

program: scripts/run_sweep.py
method: grid
metric: {name: solve_rate, goal: maximize}

parameters:
  model: {value: glm-4.7}
  strategy: {values: [llm_summary, hybrid]}
  summarizer-model: {values: [minimax-m2.1, glm-4.7, kimi-2.5, bedrock-qwen3-coder-480b]}
  instances-subset: {value: verified-mini}
  instances-shuffle: {value: false}
  call-limit: {value: 250}
  cost-limit: {value: 0.0}
  num-workers: {value: 1}
  # Paper's values (M=10, N=21)
  hp-obs-n: {value: 10}
  hp-sum-n: {value: 21}
  hp-sum-keep-m: {value: 10}

command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --wandb
  - --wandb-project=the-complexity-trap
  # NOTE: --evaluate disabled - run evaluation separately after trajectories
  # complete via: python scripts/evaluate_missing.py --subset verified-mini
